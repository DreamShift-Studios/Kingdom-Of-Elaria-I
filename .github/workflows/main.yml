name: Kingdom of Elaria I

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Kingdom of Elaria I
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom of Elaria I
          path: release/*.exe
          if-no-files-found: error
